name: steam-frame
on:
  push:
    branches: [ steam-frame ]
    tags: [ 'frame-v*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Publish the build as a GitHub pre-release with this tag (e.g. frame-v0.1.0). Leave empty to only build.
        required: false
        default: ""
concurrency:
  # Keyed on the event too, so a branch push never cancels a manual release run.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:

  # Native aarch64 Linux build for the Steam Frame. Runs on GitHub's Arm runner so nothing is
  # cross-compiled; starship.o2r is architecture independent and is built in the same job.
  build-steam-frame:
    runs-on: ubuntu-22.04-arm
    permissions:
      contents: write
    steps:
    - name: Git Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-12 g++-12 git cmake ninja-build lsb-release libpng-dev libzip-dev zipcmp zipmerge ziptool \
          nlohmann-json3-dev libspdlog-dev libboost-dev libopengl-dev libglew-dev libogg-dev libvorbis-dev libbz2-dev zlib1g-dev \
          libusb-1.0-0-dev libx11-dev libxext-dev libwayland-dev libxkbcommon-dev libpulse-dev libasound2-dev libdbus-1-dev \
          libudev-dev patchelf zip
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-arm64-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-arm64-ccache-${{ github.ref }}
          ${{ runner.os }}-arm64-ccache
    - name: Restore cached deps folder
      id: restore-cache-deps
      uses: actions/cache/restore@v4
      with:
        key: ${{ runner.os }}-arm64-deps-${{ hashFiles('.github/workflows/steam-frame.yml') }}
        path: deps
    - name: Build SDL2, SDL2_net and tinyxml2
      run: |
        export PATH="/usr/lib/ccache:$PATH"
        mkdir -p deps && cd deps
        [ -d SDL2-2.30.3 ] || { wget -q https://github.com/libsdl-org/SDL/releases/download/release-2.30.3/SDL2-2.30.3.tar.gz && tar -xzf SDL2-2.30.3.tar.gz; }
        (cd SDL2-2.30.3 && ./configure --enable-hidapi-libusb && make -j4 && sudo make install)
        [ -d SDL2_net-2.2.0 ] || { wget -q https://www.libsdl.org/projects/SDL_net/release/SDL2_net-2.2.0.tar.gz && tar -xzf SDL2_net-2.2.0.tar.gz; }
        (cd SDL2_net-2.2.0 && ./configure && make -j4 && sudo make install)
        [ -d tinyxml2-10.0.0 ] || { wget -q https://github.com/leethomason/tinyxml2/archive/refs/tags/10.0.0.tar.gz && tar -xzf 10.0.0.tar.gz; }
        (cd tinyxml2-10.0.0 && mkdir -p build && cd build && cmake .. -DBUILD_SHARED_LIBS=ON && make -j4 && sudo make install)
        sudo ldconfig
    - name: Save deps folder
      if: steps.restore-cache-deps.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        key: ${{ steps.restore-cache-deps.outputs.cache-primary-key }}
        path: deps
    - name: Build Starship for Steam Frame
      run: |
        export PATH="/usr/lib/ccache:$PATH"
        # Snapdragon 8 Gen 3 (Cortex-X4/A720/A520): stay on the ARMv8.2 baseline rather than the
        # runner's -mcpu=native, which could use features the Frame lacks.
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE=Release \
          "-DCPU_OPTION=-march=armv8.2-a+crc+crypto+dotprod;-mtune=cortex-a76"
        cmake --build build-cmake --config Release -j4
        cmake --build build-cmake --config Release --target GeneratePortO2R -j4
      env:
        CC: gcc-12
        CXX: g++-12
    - name: Package Steam Frame zip
      run: steamframe/package-steam-frame.sh build-cmake starship-steam-frame-arm64.zip
    - name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: starship-steam-frame-arm64
        path: starship-steam-frame-arm64.zip
    # Pushing a frame-v* tag, or running the workflow manually with release_tag set, publishes the
    # build as a GitHub pre-release. A manual run creates the tag on the commit it built.
    - name: Publish release
      if: startsWith(github.ref, 'refs/tags/frame-v') || inputs.release_tag != ''
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.release_tag || github.ref_name }}
        target_commitish: ${{ github.sha }}
        name: Starship for Steam Frame ${{ inputs.release_tag || github.ref_name }}
        body_path: steamframe/RELEASE_NOTES.md
        prerelease: true
        files: starship-steam-frame-arm64.zip
